graspnet_server:
  ros__parameters:
    # GraspNet intentionally does not subscribe to live image topics. YOLO
    # stores one exact RGB-D/intrinsics/mask observation under the project
    # runtime directory; the service carries only token, size and SHA-256.
    base_frame: Link_Zero_Point
    graspnet_root: third_party/graspnet-baseline
    checkpoint_path: models/graspnet/checkpoint-rs.tar
    device: cuda:0
    number_points: 20000
    number_views: 300
    minimum_target_points: 300
    depth_scale: 0.001
    target_depth_band: 0.15
    # Enable the official model-free collision filter. A zero value disables it.
    collision_threshold: 0.01
    collision_voxel_size: 0.01
    # Only geometry close enough to intersect the gripper/0.12 m approach path
    # is retained, then deterministically reduced at the detector voxel size.
    collision_scene_margin: 0.20
    auto_arm_deadband_y: 0.04
    prevent_cross_body_grasps: true
    minimum_grasp_score: 0.15
    maximum_gripper_width: 0.15
    maximum_candidates: 20
    maximum_raw_candidates: 100
    # One inference per fresh observation. Retrying the full network on the
    # same frame only makes its geometry stale; retry at the action level with
    # a newly selected observation instead.
    inference_attempts: 1
    pregrasp_offset: 0.12
    approach_axis: 0
    horizontal_grasp_filter_enabled: true
    closing_axis: 1
    vertical_axis: 2
    maximum_approach_tilt_degrees: 30.0
    maximum_closing_tilt_degrees: 30.0
    # Keep execution at the collision-checked GraspNet translation. Enabling
    # depth offset requires a second swept-volume check with calibrated S2 fingers.
    apply_grasp_depth: false
    grasp_depth_scale: 1.0
    maximum_grasp_depth_offset: 0.05
    tf_timeout: 0.2
    maximum_target_age_seconds: 0.50
    # The source may age while the 0.7 s network runs, but the coordinator must
    # obtain a new <=0.35 s observation and prove the target did not move before
    # any candidate is restamped for planning.
    maximum_post_inference_source_age_seconds: 1.50
    maximum_future_skew_seconds: 0.02
    observation_store_directory: runtime/selected_observations
    maximum_observation_payload_bytes: 67108864
    preload_backend: true
